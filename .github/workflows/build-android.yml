name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "release (signed, smooth) or debug (debuggable, slower)"
        type: choice
        default: release
        options: [release, debug]
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write # lets the tag build attach the APK to a GitHub Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The Electron binary is not needed to build the Android app (it is a devDependency for the desktop build).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_BUILDER_BINARIES_MIRROR: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already ships the Android SDK (ANDROID_HOME). Gradle downloads any missing platform itself,
      # as long as the licences are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        # The lockfile predates the Capacitor packages, so `npm install` (not `ci`) refreshes it.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Optional release keystore from repository secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
            echo "Using the release keystore from repository secrets"
          else
            echo "No keystore secret set: using the bundled sideload keystore"
          fi

      - name: Build APK
        env:
          # Optional: a Supabase project, only needed if you switch ACCOUNTS_ENABLED on (see SUPABASE_SETUP.md)
          BYTUNE_SUPABASE_URL: ${{ secrets.BYTUNE_SUPABASE_URL }}
          BYTUNE_SUPABASE_KEY: ${{ secrets.BYTUNE_SUPABASE_KEY }}
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            npm run android:build:debug
          else
            npm run android:build
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blutheist-apk
          path: release/*.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
